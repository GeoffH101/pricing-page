<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gutter Cleaning Pricing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Gutter cleaning pricing</h1>
      <p class="sub">New customer quote. Enter the address and answer a few questions.</p>
    </header>

    <section class="card" id="step1">
      <div class="two">
        <div>
          <label for="firstName">First name</label>
          <input id="firstName" type="text" autocomplete="given-name">
        </div>
        <div>
          <label for="lastName">Last name</label>
          <input id="lastName" type="text" autocomplete="family-name">
        </div>
      </div>
      <label for="phone">Phone</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 555-5555">
      <label for="email">Email</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">

      <label for="address">Property address</label>
      <input id="address" type="text" autocomplete="street-address" placeholder="123 Main St, Town, State ZIP" inputmode="text">
      <button id="lookup" type="button">Look up address</button>
      <p class="msg" id="msg1" role="alert"></p>
    </section>

    <section class="card hidden" id="step2">
      <div class="found">
        <div class="k">Address</div>
        <div id="foundAddr" class="v"></div>
        <div id="foundArea" class="area"></div>
      </div>

      <label for="sqft">Home square footage</label>
      <input id="sqft" type="number" inputmode="numeric" min="300" max="30000" step="1" placeholder="e.g. 2400">
      <p class="hint" id="sqftHint"></p>

      <fieldset>
        <legend>Does the home have gutter guards?</legend>
        <label class="opt"><input type="radio" name="guards" value="no"> No</label>
        <label class="opt"><input type="radio" name="guards" value="yes"> Yes</label>
      </fieldset>

      <label for="stories">Number of stories</label>
      <select id="stories">
        <option value="">Select</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3 or more</option>
      </select>

      <label for="roof">Roof type</label>
      <select id="roof">
        <option value="">Select</option>
        <option value="asphalt">Asphalt shingle (regular)</option>
        <option value="slate">Slate</option>
        <option value="cedar">Cedar or wood shake</option>
        <option value="tile">Tile</option>
        <option value="metal">Metal</option>
        <option value="flat">Flat or rubber roof</option>
        <option value="other">Other</option>
      </select>

      <fieldset>
        <legend>Solar panels on the roof?</legend>
        <label class="opt"><input type="radio" name="solar" value="no"> No</label>
        <label class="opt"><input type="radio" name="solar" value="yes"> Yes</label>
      </fieldset>

      <label for="lastCleaned">When were the gutters last cleaned?</label>
      <select id="lastCleaned">
        <option value="">Select</option>
        <option value="within_year">Within the past year</option>
        <option value="over_year">Over a year ago</option>
        <option value="never">Never cleaned</option>
        <option value="unsure">Not sure</option>
      </select>

      <fieldset>
        <legend>Any hard-to-reach areas? (notes only)</legend>
        <label class="opt"><input type="checkbox" name="access" value="Steep roof"> Steep roof</label>
        <label class="opt"><input type="checkbox" name="access" value="Tall or tight access"> Tall or tight access</label>
        <label class="opt"><input type="checkbox" name="access" value="Fences or landscaping in the way"> Fences or landscaping in the way</label>
      </fieldset>

      <button id="quote" type="button">Get price</button>
      <p class="msg" id="msg2" role="alert"></p>
    </section>

    <section class="card result hidden" id="step3" aria-live="polite">
      <div class="k">Gutter cleaning</div>
      <div class="price" id="price"></div>
      <div id="resultLine" class="line"></div>
      <ul id="flags" class="flags"></ul>
      <fieldset class="status">
        <legend>Next step</legend>
        <label class="opt"><input type="radio" name="estimate" value="Estimate Approved"> Estimate Approved</label>
        <label class="opt"><input type="radio" name="estimate" value="Send Estimate"> Send Estimate</label>
      </fieldset>
      <div class="row">
        <button id="copy" type="button" class="secondary">Copy quote</button>
        <button id="again" type="button" class="secondary">New quote</button>
      </div>
      <p class="msg" id="msg3"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
